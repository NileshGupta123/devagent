# ─────────────────────────────────────────
# DevAgent Docker Compose
# Runs backend + frontend together
# ─────────────────────────────────────────

version: '3.9'

services:

  # ── Backend — FastAPI ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devagent-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FRONTEND_URL=http://localhost:80
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - ENVIRONMENT=production
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Frontend — React + Nginx ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devagent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# ── Volumes ──
volumes:
  chroma_data:
    driver: local